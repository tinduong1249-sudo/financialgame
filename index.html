<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hè Này Tiêu Gì? – Game kế hoạch tài chính</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@600;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#141a26;--panel:rgba(20,26,38,.93);--text:#f4ead7;--sub:#b9b0a0;--line:rgba(244,234,215,.16);--gold:#e3b23c;--green:#7fd58a;--red:#ff8f8f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0c111a;color:var(--text);font-family:'Be Vietnam Pro',system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
h1,h2,h3{font-family:'Lora',Georgia,serif;margin:0}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{position:relative;width:100%;max-width:520px;height:100%;margin:0 auto;overflow:hidden;background:var(--bg)}
canvas#world{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hidden{display:none!important}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.btn{min-height:46px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:transparent;font-weight:600;font-size:14px}
.btn.gold{background:var(--gold);color:#1b1b1b;border:none;font-weight:700}
.btn:disabled,.opt:disabled{opacity:.4;cursor:not-allowed}
.sub{color:var(--sub);font-size:12px}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
#hud .panel{padding:8px 12px}
#hudPlace{font-family:'Lora',serif;font-weight:700;font-size:15px}
#hudMoney{font-weight:700;font-size:17px;color:var(--green);text-align:right}
#hudTime b{color:var(--gold)}
#seatBar{position:absolute;bottom:142px;max-width:96%;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(224,71,90,.94);color:#fff;border-radius:22px;padding:5px 6px 5px 14px;font-size:13px;font-weight:700;white-space:nowrap;z-index:2}
#seatBar button{min-height:34px;border-radius:17px;border:none;background:#fff;color:#1b1b1b;font-weight:700;font-size:12px;padding:0 12px}
#prompt{position:absolute;left:50%;transform:translateX(-50%);top:24%;width:min(300px,84%);padding:12px 14px;display:flex;flex-direction:column;gap:8px;z-index:2}
#prompt .row{display:flex;gap:8px}#prompt .row .btn{flex:1}
#joy{position:absolute;left:16px;bottom:24px;width:104px;height:104px;border-radius:50%;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.35);touch-action:none}
#knob{position:absolute;left:32px;top:32px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.7);pointer-events:none}
#rightBtns{position:absolute;right:12px;bottom:26px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#emoBtn{width:50px;height:50px;border-radius:50%;font-size:22px;padding:0}
#bagBtn{border-radius:24px;padding:0 16px;min-height:46px;font-weight:700;font-size:14px}
#emoBar{position:absolute;right:12px;bottom:140px;display:grid;grid-template-columns:repeat(3,48px);gap:6px;padding:8px}
#emoBar button{height:48px;border-radius:10px;border:none;background:rgba(255,255,255,.07);font-size:22px}
#hint{position:absolute;left:0;right:0;bottom:142px;text-align:center;font-size:12px;color:#f4ead7;pointer-events:none;text-shadow:0 1px 3px #000}
#toast{position:absolute;left:50%;top:118px;transform:translateX(-50%);max-width:88%;padding:10px 14px;font-size:13px;font-weight:600;line-height:1.4;text-align:center;z-index:4;pointer-events:none}
.overlay{position:absolute;inset:0;background:rgba(5,8,14,.72);display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:5}
.overlay.center{align-items:center}
.sheet{width:100%;max-height:92%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.sheet>*{flex-shrink:0}
.banner{height:120px;border-radius:12px;background-size:cover;background-position:center}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.item .nm{font-weight:600;font-size:14px}.item .pr{font-size:13px;color:var(--green)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:20px;font-weight:700}
.qty span{min-width:22px;text-align:center;font-weight:700}
.total{display:flex;justify-content:space-between;align-items:baseline}
.total b{font-size:22px;color:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.opt{min-height:58px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-weight:700;font-size:13px;padding:6px}
.opt small{display:block;font-weight:500;color:var(--sub);font-size:11px;margin-top:2px}
.opt.sel{border:2px solid var(--gold);background:rgba(227,178,60,.14)}
.weeks{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.weeks div{height:26px;border-radius:6px;border:1px solid var(--line);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.weeks .done{background:rgba(127,213,138,.25);color:var(--text)}.weeks .cur{background:var(--gold);color:#1b1b1b}
.msg{padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.05);font-size:13px;line-height:1.45;display:flex;justify-content:space-between;gap:10px}
.msg.ev{background:rgba(63,167,214,.14)}
.pos{color:var(--green);font-weight:700;white-space:nowrap}.neg{color:var(--red);font-weight:700;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;background:rgba(255,255,255,.08)}
.page{position:absolute;inset:0;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,#1b2333 0%,#141a26 60%,#0f2a3d 100%);z-index:6}
.card{padding:16px;display:flex;flex-direction:column;gap:12px}
input[type=text],input[type=number],input[type=password],select,textarea{font-family:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);width:100%}
select option{background:#1b2333}
label{font-size:13px;font-weight:600}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid transparent;padding:0}.sw.sel{border-color:var(--gold);box-shadow:0 0 0 2px #141a26 inset}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}.bar i{display:block;height:100%}
.rowb{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:4px}
.big{font-size:26px;font-weight:700}
/* host */
html:has(body.host),body.host{overflow:auto;height:auto}body.host #app{max-width:1280px;height:auto;min-height:100%;overflow:visible;background:var(--bg)}
body.host .page{position:static;background:none;padding:20px}
.hostrow{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}.hostrow>div{flex:1 1 380px;min-width:0}
.ctrls{display:flex;flex-wrap:wrap;gap:10px}
.lb{display:grid;grid-template-columns:40px 1fr 120px 130px;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.mrow{display:grid;grid-template-columns:1fr 130px 120px 44px 44px;gap:6px;align-items:center;font-size:14px;padding:4px 0;border-bottom:1px solid var(--line)}
.mrow button{height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:18px;font-weight:700}
.locs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.loc{border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);padding:12px;display:flex;flex-direction:column;gap:4px}
.loc i{display:block;height:4px;border-radius:2px}
@keyframes spin{to{transform:rotate(360deg)}}
.prow{display:grid;grid-template-columns:1fr 70px 90px 90px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
#shot{position:absolute;left:0;right:0;top:28%;text-align:center;pointer-events:none;z-index:3}
#shot b{display:block;font-family:'Lora',serif;font-size:88px;line-height:1;color:#ffe3ee;text-shadow:0 0 18px #ff5a8a,0 2px 6px #000}
#shot span{display:inline-block;margin-top:8px;font-size:14px;font-weight:700;background:rgba(0,0,0,.55);padding:6px 12px;border-radius:14px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4;transition:opacity .7s}
#flash.on{opacity:.92;transition:none}
.pv{position:fixed;inset:0;z-index:30;background:rgba(5,8,14,.92);display:flex;align-items:center;justify-content:center;padding:14px}
.pvIn{width:min(460px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px}
#pvImg{min-height:200px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px}
#pvImg img{width:100%;max-height:70vh;object-fit:contain;display:block;border-radius:6px}
.pvBtns{display:grid;grid-template-columns:52px 1fr 52px;gap:8px}
body.host .pvIn{width:min(820px,100%)} body.host #pvImg img{max-height:80vh}
.alb{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.alb button,.thumbs button{padding:0;border:none;background:rgba(255,255,255,.05);border-radius:4px;min-height:60px;overflow:hidden}
.alb img,.thumbs img{width:100%;display:block}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#mg{position:absolute;inset:0;z-index:7;background:#0c111a;display:flex;flex-direction:column}.mgTop{display:flex;align-items:center;gap:10px;padding:10px 12px}#mgBody{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 10px 14px}#mgBody canvas{width:100%;max-width:420px;touch-action:none;border-radius:12px;display:block}
#chatLog{position:absolute;left:10px;top:70px;width:62%;display:flex;flex-direction:column;gap:3px;pointer-events:none;z-index:1}
.cl{background:rgba(10,14,22,.68);border-radius:8px;padding:4px 8px;font-size:12px;line-height:1.35;transition:opacity .6s;word-break:break-word}.cl b{color:var(--gold)}
#chatBar{position:absolute;left:10px;right:10px;top:70px;display:flex;gap:8px;padding:8px;z-index:4}#chatBar input{flex:1;padding:8px 10px}
#fightHud{position:absolute;top:70px;left:50%;transform:translateX(-50%);padding:6px 12px;font-size:14px;white-space:nowrap;z-index:3}
#fightUI{position:absolute;right:12px;bottom:26px;display:grid;grid-template-columns:repeat(2,64px);gap:10px;z-index:3}
#fightUI button{width:64px;height:64px;border-radius:50%;font-size:26px;padding:0;touch-action:none}#fAtk{grid-column:2;grid-row:1/3;width:76px!important;height:76px!important;align-self:center;font-size:32px!important;background:rgba(224,71,90,.85)!important}
.warn{padding:10px 12px;border-radius:10px;background:rgba(227,178,60,.14);border:1px solid rgba(227,178,60,.4);font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <canvas id="world"></canvas>
  <div id="hud" class="hidden">
    <div class="panel"><div id="hudPlace"></div><div class="sub" id="hudPhase"></div></div>
    <div class="panel"><div id="hudMoney"></div><div class="sub" id="hudTime" style="text-align:right"></div></div>
  </div>
  <div id="seatBar" class="hidden"><span id="seatTxt"></span><button id="seatGame" class="hidden">🎮 Chơi game</button><button id="standBtn">Đứng dậy</button></div>

  <div id="joy" class="hidden" aria-hidden="true"><div id="knob"></div></div>

  <div id="fightHud" class="panel hidden"></div>
  <div id="fightUI" class="hidden"><button id="fDash" class="panel" aria-label="Tăng tốc">⚡</button><button id="fShd" class="panel" aria-label="Đỡ">🛡️</button><button id="fAtk" class="panel" aria-label="Chém">⚔️</button></div>
  <div id="rightBtns" class="hidden"><button id="chatBtn" class="panel hidden" aria-label="Chat" style="width:50px;height:50px;border-radius:50%;font-size:20px;padding:0">💬</button><button id="emoBtn" class="panel" aria-label="Thả biểu cảm">😊</button><button id="bagBtn" class="panel"></button></div>

  <div id="modal" class="overlay hidden"><div class="panel sheet" id="sheet"></div></div>
  <div id="mg" class="hidden"><div class="mgTop"><b id="mgTitle" style="font-family:'Lora',serif;font-size:18px;flex:1"></b><span id="mgInfo" class="sub" style="font-weight:700;color:var(--green)"></span><button class="btn" id="mgX" aria-label="Đóng mini-game" style="min-height:40px">✕</button></div><div id="mgBody"></div></div>
  <div id="pageBox" class="page hidden"></div>
</div>
<div id="pv" class="pv hidden" role="dialog" aria-label="Xem ảnh Polaroid"><div class="pvIn"><div id="pvTitle" style="font-family:'Lora',serif;font-weight:700;font-size:18px"></div><div id="pvImg">Đang in ảnh…</div><div id="pvCap" class="sub" style="font-size:13px"></div><div class="pvBtns"><button class="btn" id="pvPrev" aria-label="Ảnh trước">‹</button><button class="btn gold" id="pvSave">Lưu ảnh về máy</button><button class="btn" id="pvNext" aria-label="Ảnh sau">›</button></div><button class="btn" id="pvClose">Đóng</button><div class="sub">Nếu nút lưu không chạy: nhấn giữ vào ảnh rồi chọn "Lưu ảnh" / "Thêm vào Ảnh".</div></div></div>

/* ---- "Cách của tôi": gửi cho chủ phòng chấm, chờ tối đa 2 phút ---- */
const CU_WAIT = 120;
function sendCustom(sit, text) {
  const rid = uid(), wk = S.week; const out = runRound(-1);
  S.cuWait = { rid, until:Date.now() + CU_WAIT * 1000, out, text };
  if (inbox) inbox.send({ t:'cu', id:ME, rid, n:S.name, job:S.job.name, wk:wk + 1, q:sit.q, x:text });
  showCuWait();
}
function showCuWait() {
  const w = S.cuWait; if (!w) return;
  openModal(`<h2>Chờ chủ phòng chấm</h2><div class="msg" style="display:block">"${esc(w.text)}"</div><div style="text-align:center"><div class="sub">Còn lại</div><div class="big" id="cuClock" style="color:var(--gold)"></div></div><div class="sub">Lương cơ bản đã được cộng. Bạn có thể đóng lại đi dạo, có kết quả game sẽ báo.</div><button class="btn" id="mClose">Đóng</button>`, true);
  $('mClose').onclick = closeModal; cuTick();
}
function cuTick() {
  const w = S.cuWait; if (!w) return; const s = Math.max(0, Math.ceil((w.until - Date.now()) / 1000));
  if ($('cuClock')) $('cuClock').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  if (s <= 0) cuDone(null);
}
setInterval(cuTick, 1000);
function cuDone(g) {
  const w = S.cuWait; if (!w) return; S.cuWait = null;
  if (S.phase !== 2 || !S.job) return;
  const out = w.out.slice();
  if (g) out.push({ t:'Chủ phòng chấm cách của bạn', d:g.amt ? pay(CAT(), g.amt) : 0, ev:true });
  else out.push({ t:'Hết 2 phút chưa được chấm, bạn chỉ nhận lương cơ bản.', d:0, ev:true });
  hud(); report(true); openWeek(out);
}
function finishPhase2(timeout) {
  if (S.phase >= 3) return;
  S.cuWait = null;
  if (S.job && S.week < ROUNDS) { S.autoWeeks = ROUNDS - S.week; while (S.week < ROUNDS) runRound(-1); }
  settle(); standUp(true); S.phase = 3; closeModal(); hidePrompt(); report(true); saveGame(); showSummary(timeout);
}

/* ================== GỬI BÁO CÁO CHO CHỦ PHÒNG ================== */
let repDirty = false, lastRep = 0;

function locName() { if (!map) return 'Sảnh chờ'; if (S.phase >= 3) return 'Đã xong'; if (map.kind === 'shop') return 'Trong ' + map.shop.name; return map.phase === 2 ? 'Khu việc làm' : (onLoop(player.x, player.y) ? 'Photobooth Cầu Rồng' : map.phase === 1 && inArena(player.x, player.y) ? 'Arena game' : 'Phố Bạch Đằng'); }
function report(force) {
  if (!inbox) return; const now = Date.now();
  if (!force && !(repDirty && now - lastRep > 2500) && now - lastRep < 8000) return;
  repDirty = false; lastRep = now;
  inbox.send({ t:'r', id:ME, n:S.name, loc:locName(), w:S.wallet, h:S.held, job:S.job ? S.job.name : '', ph:S.phase, wk:S.week, sp:S.spend, lg:S.ledger, done:S.phase >= 3, late:S.late });
}
function act(text) { if (inbox) inbox.send({ t:'a', id:ME, n:S.name, x:text }); dirtyReport(); }
setInterval(() => { if (S.hosted && S.phase >= 0 && S.name) report(false); }, 1000);
let joinTimer = 0;
function sendJoin() { if (inbox) inbox.send({ t:'join', id:ME, n:S.name }); clearInterval(joinTimer); joinTimer = setInterval(() => { if (S.awaitOK && inbox) inbox.send({ t:'join', id:ME, n:S.name }); }, 4000); }
function showWaiting() {
  $('pageBox').innerHTML = `<div style="flex:1"></div><div class="panel card" style="text-align:center;align-items:center"><div style="width:44px;height:44px;border-radius:50%;border:4px solid rgba(227,178,60,.25);border-top-color:var(--gold);animation:spin 1s linear infinite"></div><h2>Đang chờ chủ phòng duyệt</h2><div style="font-size:14px;line-height:1.5">Phòng <b>${esc(S.code)}</b> · Tên của bạn: <b>${esc(S.name)}</b><br>Chủ phòng sẽ cho bạn vào trong giây lát.</div><button class="btn" id="wCancel">Hủy, quay lại</button></div><div style="flex:1"></div>`;

}
function showRejected(kicked) {
  S.awaitOK = false; S.hosted = false; clearInterval(joinTimer); clearSave(); closeModal(); standUp(true);
  ['hud', 'joy', 'rightBtns', 'hint', 'prompt', 'seatBar', 'emoBar'].forEach(i => $(i).classList.add('hidden')); map = null;

  $('pageBox').classList.remove('hidden'); $('rjBack').onclick = () => location.reload();
}
function onCtl(m) {
  if (!m) return;
  if (m.t === 's') {
    if (!S.hosted && !S.waitingHost && !S.awaitOK) return;
    S.lastHost = Date.now();
    S.timeLeft = m.rem; S.paused = !!m.pa; S.emotes = m.em !== false; if (CHAT.on !== (m.ch !== false)) { CHAT.on = m.ch !== false; if (!CHAT.on) $('chatBar').classList.add('hidden'); chatOpen(); }
    if (!S.emotes) $('emoBar').classList.add('hidden');
    if (m.rk && m.rk[ME]) { S.rank = m.rk[ME]; S.total = m.tot; if ($('rankBox')) { $('rankBox').textContent = '#' + S.rank + ' / ' + S.total; $('rankBox').style.fontSize = '24px'; } }
    if (S.waitingHost) { S.waitingHost = false; S.awaitOK = true; showWaiting(); sendJoin(); }
    if (S.awaitOK) {
      if (m.rj && m.rj.includes(ME)) { showRejected(); return; }
      if (!(m.ap && m.ap.includes(ME))) return;
      S.awaitOK = false; clearInterval(joinTimer); S.hosted = true; S.phase = m.ph >= 2 ? 1 : 0;
      if (m.ph >= 2 && !S.resumed) { S.late = true; if (m.avg) pay('Vào trễ (trừ mức tiêu TB của lớp)', -m.avg); }
      beginWorld();
      if (S.late) setTimeout(() => toast('Bạn vào trễ nên bị trừ ' + fmt(m.avg || 0) + ' (mức tiêu trung bình của lớp ở giai đoạn 1).', 8000), 600);
    }
    if (S.hosted && m.rj && m.rj.includes(ME)) { showRejected(true); return; }
    if (m.ph >= 1 && S.phase === 0) startPhase1();
    if (m.ph >= 2 && S.phase === 1) startPhase2(false);
    if (m.ph >= 3 && S.phase === 2) finishPhase2(false);
    hud(); return;
  }
  if (!S.hosted) return;
  if (m.t === 'ev' && !S.seen[m.id]) {
    S.seen[m.id] = 1;
    if (m.amt) pay('Sự kiện lớp', -m.amt);
    const sh = shopById(m.place), lv = m.place === 'lovely';
    if (S.phase === 1 && sh) { closeModal(); enterShop(sh.id); }
    if (S.phase === 1 && lv) { closeModal(); goStreet1(LV.deck[0] + 8 + Math.random() * 32, LV.deck[1] + 8 + Math.random() * 50); }
    infoModal(sh ? 'Cả lớp tụ tập ở ' + sh.name : lv ? 'Cả lớp ra Photobooth Cầu Rồng chụp ảnh' : 'Thông báo từ chủ phòng', esc(m.msg || '') + (m.amt ? `<br><br>Bạn bị trừ <b class="neg">${fmt(m.amt)}</b>.` : ''));
  }
  if (m.t === 'mo' && m.to === ME && !S.seen[m.id]) {
    S.seen[m.id] = 1; pay('Chủ phòng điều chỉnh', m.amt);
    toast('Chủ phòng ' + (m.amt >= 0 ? 'cộng ' : 'trừ ') + fmt(Math.abs(m.amt)) + (m.note ? ': ' + m.note : ''), 5000); hud(); report(true);
  }
  if (m.t === 'cg' && m.to === ME && S.cuWait && m.rid === S.cuWait.rid) cuDone({ amt:Math.max(-5000 * K, Math.min(5000 * K, Math.round(+m.amt || 0))) });
  if (m.t === 'nm' && m.to === ME) { S.name = cleanName(m.n); store('hntg_me', { name:S.name, gender:S.gender, shirt:S.shirt, ap:S.ap, code:S.code }); sendPos(true); report(true); toast('Chủ phòng đã đổi tên bạn thành ' + S.name, 5000); }
  if (m.t === 'call' && !S.seen[m.id]) {
    S.seen[m.id] = 1; closeModal();
    if (S.phase === 2) goStreet2(); else if (S.phase < 3) goStreet1(236, 104);
    toast('Chủ phòng gọi cả lớp về Cầu Rồng!', 4000);
  }
}

        <div class="panel card"><h2>Cả lớp tiêu tiền ở đâu</h2><div id="hSpend" style="display:flex;flex-direction:column;gap:8px"></div></div>
        <div class="panel card"><h2>Con đường được chọn</h2><div class="grid3" id="hJobs"></div></div>
        <div class="panel card"><h2>Xuất kết quả</h2><div class="sub">Tải bảng kết quả để mở bằng Excel hoặc Google Sheets.</div><div class="grid2"><button class="btn" id="xCsv">Tải file CSV</button><button class="btn" id="xCopy">Sao chép</button></div></div>
      </div>
    </div>
    <div class="panel card" style="border-color:rgba(255,126,182,.5)"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>Album lớp · Photobooth Cầu Rồng <span id="hAlbN" class="tag" style="font-size:14px"></span></h2><button class="btn gold" id="hAlbShow">Trình chiếu album</button></div><div class="alb" id="hAlb"></div><div class="sub">Ảnh hiện ở đây ngay khi các bạn chụp. Chạm vào ảnh để xem lớn, bấm mũi tên trái/phải để chuyển ảnh.</div></div>`;
  $('hAlbShow').onclick = () => { const l = albumList(); if (!l.length) return toast('Chưa có ảnh nào.'); openViewer(l, 0); };
  $('hBack').onclick = () => { location.hash = ''; };
  $('hChTog').onclick = () => { HOST.chatOn = HOST.chatOn === false; feed(HOST.chatOn ? 'Bật chat' : 'Tắt chat'); hostBroadcast(); hostChat(); };
  const hSend = () => { const x = cleanChat($('hChIn').value); if (!x) return; chatCh.send({ t:'c', id:'host', n:'Chủ phòng', x }); HOST.chat.push({ n:'Chủ phòng', x, t:new Date().toTimeString().slice(0, 5) }); $('hChIn').value = ''; hostChat(); };
  $('hChGo').onclick = hSend; $('hChIn').onkeydown = e => { if (e.key === 'Enter') hSend(); }; hostChat();
  $('d1').value = Math.round(HOST.dur[1] / 60); $('d2').value = Math.round(HOST.dur[2] / 60);
  $('d1').onchange = () => { HOST.dur[1] = Math.max(1, Math.min(60, +$('d1').value || 5)) * 60; saveHost(); };
  $('d2').onchange = () => { HOST.dur[2] = Math.max(1, Math.min(60, +$('d2').value || 5)) * 60; saveHost(); };
  const addMin = d => { if (HOST.ph !== 1 && HOST.ph !== 2) return toast('Chỉ chỉnh được khi đang ở GĐ 1 hoặc GĐ 2'); if (HOST.pa) HOST.rem = Math.max(0, HOST.rem + d); else HOST.endAt = Math.max(Date.now(), (hostRem() > 0 ? HOST.endAt : Date.now()) + d * 1000); feed((d > 0 ? 'Thêm ' : 'Bớt ') + '1 phút'); hostBroadcast(); hostRender(true); };
  $('tPlus').onclick = () => addMin(60); $('tMinus').onclick = () => addMin(-60);
  $('hCu').onclick = e => { const b = e.target.closest('button[data-rid]'); if (!b) return; const c = HOST.cus[b.dataset.rid]; if (!c) return;
    let amt = b.dataset.a === 'x' ? Math.round((+$('cx-' + b.dataset.rid).value || 0) * 1000) : +b.dataset.a;
    ctl.send({ t:'cg', id:uid(), to:c.to, rid:b.dataset.rid, amt }); feed(c.n + ' (' + c.job + ', TH ' + c.wk + '): "' + c.x + '" → ' + sgn(amt)); delete HOST.cus[b.dataset.rid]; hostRender(true); };
  $('hOkAll').onclick = () => { Object.keys(HOST.pending).forEach(approve); hostBroadcast(); hostRender(true); };
  $('hPend').onclick = e => { const b = e.target.closest('button[data-id]'); if (!b) return; b.dataset.k === 'ok' ? approve(b.dataset.id) : reject(b.dataset.id); hostBroadcast(); hostRender(true); };
  $('kickGo').onclick = () => { const id = $('rnP').value; if (!id) return toast('Chọn một bạn trước'); if ($('kickGo').dataset.arm !== id) { $('kickGo').dataset.arm = id; $('kickGo').textContent = 'Bấm lần nữa để mời ra'; setTimeout(() => { $('kickGo').dataset.arm = ''; $('kickGo').textContent = 'Mời ra khỏi phòng'; }, 4000); return; } reject(id); $('kickGo').dataset.arm = ''; $('kickGo').textContent = 'Mời ra khỏi phòng'; hostBroadcast(); hostRender(true); };
  $('cP1').onclick = () => setPhase(1); $('cP2').onclick = () => setPhase(2);
  $('cP3').onclick = () => {
    const left = Object.values(HOST.players).filter(p => !p.done && (p.wk || 0) < ROUNDS).length;
    if (left && Date.now() > HOST.armEnd) { HOST.armEnd = Date.now() + 5000; $('cP3').textContent = 'Còn ' + left + ' bạn chưa xong 5 tình huống. Bấm lần nữa để kết thúc'; setTimeout(() => hostRender(true), 5100); return; }
    HOST.armEnd = 0; setPhase(3);
  };
  $('rnGo').onclick = () => { const id = $('rnP').value, n = cleanName($('rnN').value); if (!id || !HOST.players[id]) return; ctl.send({ t:'nm', to:id, n }); feed('Đổi tên ' + HOST.players[id].n + ' thành ' + n); HOST.players[id].n = n; $('rnN').value = ''; hostRender(true); };
  $('cPause').onclick = () => { if (HOST.pa) { HOST.endAt = Date.now() + HOST.rem * 1000; HOST.pa = false; } else { HOST.rem = hostRem(); HOST.pa = true; } hostBroadcast(); hostRender(true); };
  $('cEmo').onclick = () => { HOST.em = !HOST.em; hostBroadcast(); hostRender(true); };
  $('cCall').onclick = () => { ctl.send({ t:'call', id:uid() }); feed('Chủ phòng gọi cả lớp về Cầu Rồng'); hostRender(true); };
  $('cNew').onclick = () => { if (Date.now() > HOST.armEnd) { HOST.armEnd = Date.now() + 5000; $('cNew').textContent = 'Bấm lần nữa: xóa ván hiện tại, tạo phòng mới'; setTimeout(() => { $('cNew').textContent = 'Đổi mã phòng mới'; }, 5000); return; } store('hntg_room', String(Math.floor(1000 + Math.random() * 9000))); try { localStorage.removeItem('hntg_host'); } catch (e) {} location.reload(); };
  $('evGo').onclick = () => { const amt = Math.max(0, +$('evA').value || 0), place = $('evP').value, msg = $('evM').value.trim(); ctl.send({ t:'ev', id:uid(), place, msg, amt }); feed('Sự kiện: ' + (msg || '(không lời nhắn)') + (amt ? ' · trừ ' + fmt(amt) + ' mỗi người' : '')); toast('Đã gửi sự kiện'); hostRender(true); };
  $('mStep').oninput = () => { HOST.step = Math.max(1000, +$('mStep').value || 0); };
  $('hMoney').onclick = e => { const b = e.target.closest('button[data-p]'); if (!b) return; const p = HOST.players[b.dataset.p], amt = HOST.step * +b.dataset.d; ctl.send({ t:'mo', id:uid(), to:b.dataset.p, amt, note:'' }); feed((amt > 0 ? 'Cộng ' : 'Trừ ') + fmt(Math.abs(amt)) + ' cho ' + p.n); p.w += amt; hostRender(true); };
  $('xCsv').onclick = () => { const blob = new Blob(['﻿' + csv()], { type:'text/csv' }), a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'ket-qua-lop-' + HOST.code + '.csv'; a.click(); };
  $('xCopy').onclick = () => { navigator.clipboard.writeText(csv()).then(() => toast('Đã sao chép, dán vào Google Sheets là được'), () => toast('Trình duyệt không cho sao chép')); };
  setInterval(hostBroadcast, 3000); setInterval(() => hostRender(false), 1000); setInterval(saveHost, 2000);
  hostBroadcast(); hostRender(true);
}
const albumList = () => Object.values(HOST.photos).sort((a, b) => a.at - b.at);
function hostChat() { if (!$('hChat')) return; $('hChTog').textContent = HOST.chatOn === false ? 'Bật chat' : 'Tắt chat'; const el = $('hChat'), atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 30; el.innerHTML = HOST.chat.map(c => `<div class="msg"><span><b>${esc(c.n)}:</b> ${esc(c.x)}</span><span class="sub">${c.t}</span></div>`).join('') || '<div class="sub">Chưa có tin nhắn.</div>'; if (atBottom) el.scrollTop = el.scrollHeight; }
function csv() {
  const cats = [...new Set(Object.values(HOST.players).flatMap(p => Object.keys(p.lg)))];
  const head = ['Hạng', 'Tên', 'Vào trễ', 'Con đường', 'Tiền cuối', 'Tiền mặt', 'Đang đầu tư', ...SPEND_PLACES.map(s => 'Tiêu ở ' + s.name), ...cats];
  const rows = Object.values(HOST.players).sort((a, b) => (b.w + b.h) - (a.w + a.h)).map((p, i) => [i + 1, p.n, p.late ? 'có' : '', p.job, p.w + p.h, p.w, p.h, ...SPEND_PLACES.map(s => p.sp[s.id] || 0), ...cats.map(c => p.lg[c] || 0)]);
  return [head, ...rows].map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
}
let lastMoneyHtml = '';
function hostRender(force) {
  const ps = Object.values(HOST.players), s = Math.ceil(hostRem());
  $('hCount').textContent = ps.length;
  $('hPhase').textContent = ['Sảnh chờ', 'GĐ 1 · Tiêu tiền', 'GĐ 2 · Đi làm', 'Tổng kết'][HOST.ph] + (HOST.pa ? ' · Tạm dừng' : '');
  $('hClock').textContent = (HOST.ph === 1 || HOST.ph === 2) && s <= 0 ? 'HẾT GIỜ' : HOST.ph === 1 || HOST.ph === 2 ? String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0') : '';
  $('cPause').textContent = HOST.pa ? 'Chạy tiếp đồng hồ' : 'Tạm dừng đồng hồ';
  $('cEmo').textContent = HOST.em ? 'Tắt biểu cảm' : 'Bật biểu cảm';
  if (Date.now() > HOST.armEnd) $('cP3').textContent = 'Kết thúc, tổng kết';
  const pend = Object.entries(HOST.pending).sort((a, b) => a[1].at - b[1].at);
  $('hPendN').textContent = pend.length ? pend.length + ' bạn' : 'trống'; $('hOkAll').disabled = !pend.length;
  const ph = pend.map(([id, p]) => `<div class="prow"><b>${esc(p.n)}</b><span class="sub">${new Date(p.at).toTimeString().slice(0, 5)}</span><button class="btn gold" data-id="${id}" data-k="ok">Duyệt</button><button class="btn" data-id="${id}" data-k="no">Từ chối</button></div>`).join('') || '<div class="sub" style="padding:6px 0">Chưa có ai xin vào. Đọc mã phòng cho cả lớp nhé.</div>';
  if ($('hPend').dataset.h !== ph) { $('hPend').innerHTML = ph; $('hPend').dataset.h = ph; }
  const opts = '<option value="">Chọn bạn…</option>' + Object.values(HOST.players).sort((a, b) => a.n.localeCompare(b.n, 'vi')).map(p => `<option value="${p.id}">${esc(p.n)}</option>`).join('');
  if ($('rnP').dataset.h !== opts) { const v = $('rnP').value; $('rnP').innerHTML = opts; $('rnP').value = v; $('rnP').dataset.h = opts; }
  const locs = {}; ps.forEach(p => { if (Date.now() - p.seen < 25000 || p.done) locs[p.loc] = (locs[p.loc] || 0) + 1; });
  const order = ['Phố Bạch Đằng', 'Photobooth Cầu Rồng', 'Arena game', ...SHOPS.map(s => 'Trong ' + s.name), 'Khu việc làm', 'Đã xong'];
  const colors = { 'Phố Bạch Đằng':'#b9b0a0', 'Photobooth Cầu Rồng':'#ff7eb6', 'Arena game':'#e0475a', 'Khu việc làm':'#3fbf7f', 'Đã xong':'#e3b23c' }; SHOPS.forEach(s => colors['Trong ' + s.name] = s.color);
  $('hLocs').innerHTML = order.filter(l => locs[l] || l === 'Phố Bạch Đằng').map(l => `<div class="loc"><i style="background:${colors[l] || '#888'}"></i><span style="font-size:13px;font-weight:600">${esc(l)}</span><span class="big">${locs[l] || 0}</span></div>`).join('');
  const mh = ps.sort((a, b) => a.n.localeCompare(b.n, 'vi')).map(p => `<div class="mrow"><b>${esc(p.n)}</b><span class="sub">${esc(p.loc)}</span><span style="text-align:right;color:var(--green);font-weight:700">${fmt(p.w + p.h)}</span><button data-p="${p.id}" data-d="-1" aria-label="Trừ tiền" style="color:var(--red)">−</button><button data-p="${p.id}" data-d="1" aria-label="Cộng tiền" style="color:var(--green)">+</button></div>`).join('') || '<div class="sub">Chưa có ai vào phòng. Đọc mã phòng cho cả lớp nhé.</div>';
  if (mh !== lastMoneyHtml) { $('hMoney').innerHTML = mh; lastMoneyHtml = mh; }
  $('hFeed').innerHTML = HOST.feed.map(f => `<div class="msg"><span>${esc(f.x)}</span><span class="sub">${f.t}</span></div>`).join('') || '<div class="sub">Chưa có gì.</div>';
  const board = [...ps].sort((a, b) => (b.w + b.h) - (a.w + a.h));
  $('hBoard').innerHTML = board.map((p, i) => `<div class="lb"><b>#${i + 1}</b><span>${esc(p.n)}${p.late ? ' <span class="sub">· vào trễ</span>' : ''}${p.done ? '' : ' <span class="sub">· đang chơi</span>'}</span><span class="sub">${esc(p.job || '—')}</span><b style="text-align:right;color:var(--green)">${fmt(p.w + p.h)}</b></div>`).join('') || '<div class="sub">Chưa có dữ liệu.</div>';
  const tot = SPEND_PLACES.map(s => [s, ps.reduce((t, p) => t + Math.max(0, p.sp[s.id] || 0), 0)]).sort((a, b) => b[1] - a[1]), mx = Math.max(1, tot[0][1]);
  $('hSpend').innerHTML = tot.map(([s, v]) => `<div><div class="rowb"><span>${esc(s.name)}</span><span>${fmt(v)}</span></div><div class="bar"><i style="width:${Math.round(v / mx * 100)}%;background:${s.color}"></i></div></div>`).join('');
  Object.keys(HOST.cus).forEach(k => { if (Date.now() - HOST.cus[k].at > (CU_WAIT + 5) * 1000) delete HOST.cus[k]; });
  const cl = Object.entries(HOST.cus).sort((a, b) => a[1].at - b[1].at), ck = cl.map(c => c[0]).join();
  $('hCuN').textContent = cl.length ? cl.length + ' câu' : 'trống';
  if ($('hCu').dataset.k !== ck) { $('hCu').dataset.k = ck; $('hCu').innerHTML = cl.map(([rid, c]) => `<div class="msg" style="display:flex;flex-direction:column;gap:8px;background:rgba(155,107,255,.12)"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(c.n)} · ${esc(c.job)} · TH ${c.wk}</b><span class="sub" data-cd="${c.at}"></span></div><div class="sub">${esc(c.q)}</div><div style="font-size:16px;font-weight:600">"${esc(c.x)}"</div><div class="ctrls">${[-500, 0, 300, 700].map(a => `<button class="btn ${a > 0 ? 'gold' : ''}" data-rid="${rid}" data-a="${a * K}">${a > 0 ? '+' : ''}${a}k</button>`).join('')}<input id="cx-${rid}" type="number" step="50" placeholder="nghìn đồng" style="width:130px"><button class="btn" data-rid="${rid}" data-a="x">Chấm số này</button></div></div>`).join('') || '<div class="sub">Chưa có câu nào.</div>'; }
  $('hCu').querySelectorAll('[data-cd]').forEach(el => { const left = Math.max(0, CU_WAIT - Math.floor((Date.now() - +el.dataset.cd) / 1000)); el.textContent = 'còn ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'); });
  const al = albumList(), ak = al.map(p => p.sid).join();
  $('hAlbN').textContent = al.length + ' ảnh';
  if ($('hAlb').dataset.k !== ak) { $('hAlb').dataset.k = ak; if (al.length) thumbs(al, $('hAlb')); else $('hAlb').innerHTML = '<div class="sub">Chưa có ảnh nào. Gợi ý: gửi sự kiện "Photobooth Cầu Rồng" để gọi cả lớp ra chụp ảnh chung.</div>'; }
  $('hJobs').innerHTML = JOBS.map(j => `<div class="opt" style="display:flex;flex-direction:column;justify-content:center;text-align:center"><span class="big">${ps.filter(p => p.job === j.name).length}</span><small>${esc(j.name)}</small></div>`).join('');
}

/* ================== KHỞI ĐỘNG ================== */
window.addEventListener('hashchange', () => location.reload());
window.addEventListener('pagehide', () => { if (locCh) locCh.send({ t:'bye', id:ME }); });
if (location.hash === '#host') showHost();
else {
  resize(); requestAnimationFrame(loop);
  const sv = store('hntg_save_' + ME);
  if (sv && sv.hosted && Date.now() - sv.at < 3 * 3600e3) resumeGame(sv); else showLobby();
}
</script>
</body>
